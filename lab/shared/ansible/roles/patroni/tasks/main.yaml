- name: "install_python3_venv"
  become: true
  ansible.builtin.apt:
    name: "python3-venv"
    state: present

- name: "create_patroni_venv"
  become: true
  ansible.builtin.command:
    cmd: "python3 -m venv {{ patroni_venv_dir }}"
    creates: "{{ patroni_venv_dir }}/bin/activate"

- name: "install_patroni"
  become: true
  ansible.builtin.pip:
    name:
      - "patroni[etcd3]=={{ patroni_version }}"
      - "psycopg2-binary"
    virtualenv: "{{ patroni_venv_dir }}"
    state: present

- name: "create_patroni_config_dir"
  become: true
  ansible.builtin.file:
    path: "{{ patroni_config_dir }}"
    state: directory
    owner: "postgres"
    group: "postgres"
    mode: "0750"

- name: "write_patroni_config"
  become: true
  ansible.builtin.template:
    src: "{{ patroni_config_template }}"
    dest: "{{ patroni_config_dir }}/patroni.yaml"
    owner: "postgres"
    group: "postgres"
    mode: "0640"
  notify: "restart_patroni"

- name: "write_patroni_service"
  become: true
  ansible.builtin.template:
    src: "patroni.service.j2"
    dest: "/etc/systemd/system/patroni.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - "reload_systemd"
    - "restart_patroni"

- name: "enable_and_start_patroni"
  become: true
  ansible.builtin.systemd:
    name: "patroni"
    state: started
    enabled: true
    daemon_reload: true
