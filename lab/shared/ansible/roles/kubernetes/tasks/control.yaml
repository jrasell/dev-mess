---
- name: "check_apiserver_config"
  become: true
  ansible.builtin.stat:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
  register: kubernetes_control_plane_manifest

- name: "create_control_config"
  become: true
  ansible.builtin.command: kubeadm token create --print-join-command
  delegate_to: "{{ kubernetes_bootstrap_host }}"
  register: kubernetes_control_plane_join
  changed_when: false
  no_log: true
  when: not kubernetes_control_plane_manifest.stat.exists

- name: "create_certs"
  become: true
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  delegate_to: "{{ kubernetes_bootstrap_host }}"
  register: kubernetes_uploaded_certs
  no_log: true
  when: not kubernetes_control_plane_manifest.stat.exists

- name: "join_cluster"
  become: true
  ansible.builtin.command:
    cmd: >-
      {{ kubernetes_control_plane_join.stdout }}
      --control-plane --certificate-key {{ kubernetes_uploaded_certs.stdout_lines[-1] }}
      --apiserver-advertise-address {{ ansible_host }}
    creates: /etc/kubernetes/manifests/kube-apiserver.yaml
  no_log: true
  when: not kubernetes_control_plane_manifest.stat.exists
