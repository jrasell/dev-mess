- block:
    - name: "ensure_tls_dir"
      ansible.builtin.file:
        path: "{{ tls_path }}"
        state: directory

    - name: "get_mkcert_caroot"
      ansible.builtin.command:
        cmd: "mkcert -CAROOT"
      register: mkcert_caroot
      changed_when: false

    - name: "check_existing_mkcert_certificate"
      ansible.builtin.stat:
        path: "{{ tls_path }}/{{ item['agent-name'] }}.pem"
      register: mkcert_certificate_exists

    - name: "create_mkcert_certificate"
      ansible.builtin.command:
        cmd: >-
          mkcert
          -client
          -cert-file "{{ tls_path }}/{{ item['agent-name'] }}.pem"
          -key-file "{{ tls_path }}/{{ item['agent-name'] }}-key.pem"
          127.0.0.1
          {{ item['ip'] }}
          {{ ansible_host }}
          {{ item['dns'] | default('') }}
      when: not mkcert_certificate_exists.stat.exists

    - name: "copy_mkcert_ca_certificate"
      ansible.builtin.copy:
        src: "{{ mkcert_caroot.stdout | trim }}/rootCA.pem"
        dest: "{{ tls_path }}/{{ tls_ca_pem_filename }}"
        mode: "0644"

  delegate_to: 127.0.0.1
  become: false
