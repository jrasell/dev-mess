---
# Exposes the Cilium Agent Hubble gRPC peer endpoint so Hubble Relay can
# discover and stream flows from all nodes in the cluster.
apiVersion: v1
kind: Service
metadata:
  name: hubble-peer
  namespace: networking
  labels:
    k8s-app: cilium
spec:
  selector:
    k8s-app: cilium
  ports:
    - name: peer-service
      port: 4244
      protocol: TCP
      targetPort: 4244
