---
# Deploys Hubble Relay to aggregate flow telemetry across all Cilium Agent nodes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-relay
  namespace: networking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hubble-relay
  template:
    metadata:
      labels:
        app: hubble-relay
    spec:
      containers:
        - name: hubble-relay
          image: quay.io/cilium/hubble-relay:v1.20.3
          command:
            - hubble-relay
          args:
            - serve
          ports:
            - name: grpc
              containerPort: 4245
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/hubble-relay
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hubble-relay-config

---
# Deploys Hubble UI (frontend SPA + backend gRPC-Web bridge to Hubble Relay)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-ui
  namespace: networking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hubble-ui
  template:
    metadata:
      labels:
        app: hubble-ui
    spec:
      serviceAccountName: hubble-ui
      containers:
        - name: frontend
          image: quay.io/cilium/hubble-ui:v0.13.3
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 10
          volumeMounts:
            - name: hubble-ui-nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tmp-dir
              mountPath: /tmp
        - name: backend
          image: quay.io/cilium/hubble-ui-backend:v0.13.3
          env:
            - name: EVENTS_SERVER_PORT
              value: "8090"
            - name: FLOWS_API_ADDR
              value: "hubble-relay:4245"
          ports:
            - name: grpc
              containerPort: 8090
      volumes:
        - name: hubble-ui-nginx-conf
          configMap:
            name: hubble-ui-nginx
        - name: tmp-dir
          emptyDir: {}
