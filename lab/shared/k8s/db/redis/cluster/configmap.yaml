---
# Redis Cluster node configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
data:
  redis.conf: |
    # Redis Cluster node configuration
    bind 0.0.0.0
    port 6379
    protected-mode no

    # Cluster mode settings
    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 5000
    cluster-preferred-endpoint-type ip

    # Persistence (AOF + RDB snapshot)
    dir /data
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000

    # Memory management (adjust per shard)
    maxmemory 256mb
    maxmemory-policy allkeys-lru
