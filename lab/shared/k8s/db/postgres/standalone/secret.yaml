---
# Postgres credentials all created using  "echo -n 'postgres' | base64" and are
# not meant to be secure for this lab environment.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=     # postgres
  POSTGRES_PASSWORD: cG9zdGdyZXM= # postgres
  POSTGRES_DB: cG9zdGdyZXM=       # postgres
