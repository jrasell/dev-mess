---
apiVersion: v1
kind: Service
metadata:
  name: traefik
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      nodePort: 30080
    - name: dashboard
      port: 8080
      targetPort: dashboard
      nodePort: 30081
