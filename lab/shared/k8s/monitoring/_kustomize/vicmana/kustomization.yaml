---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - ../../_namespace
  - ../../kube-metrics-server
  - ../../kube-state-metrics
  - ../../prometheus/node-exporter
  - ../../victoria-metrics/victoria-metrics/standalone
  - ../../victoria-metrics/victoria-logs/standalone
  - ../../victoria-metrics/vmalert/standalone
  - ../../prometheus/alertmanager/standalone
  - ../../grafana/grafana
  - ../../grafana/promtail
  - ../../grafana/pyroscope/standalone

patches:
  - target:
      kind: DaemonSet
      name: promtail
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: promtail
      spec:
        template:
          spec:
            containers:
              - name: promtail
                env:
                  - name: PROMTAIL_CLIENT_URL
                    value: "http://victorialogs.monitoring.svc.cluster.local:9428/insert/loki/api/v1/push?_stream_fields=node,namespace,pod,container,app,job"
