---
# Registers kube-metrics-server with the Kubernetes aggregation layer for `metrics.k8s.io/v1beta1`
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
  labels:
    app: kube-metrics-server
spec:
  service:
    name: kube-metrics-server
    namespace: monitoring
  group: metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
