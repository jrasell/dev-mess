---
unauthorized_user:
  url_map:
    - src_paths:
        - "/api/v1/write"
      url_prefix: "http://vminsert.monitoring.svc.cluster.local:8480/insert/0/prometheus"

    - src_paths:
        - "/insert/.*"
      url_prefix: "http://vminsert.monitoring.svc.cluster.local:8480"

    - src_paths:
        - "/select/.*"
      url_prefix: "http://vmselect.monitoring.svc.cluster.local:8481"

    - src_paths:
        - "/vmui.*"
        - "/prometheus/.*"
        - "/api/v1/.*"
        - "/.*"
      url_prefix: "http://vmselect.monitoring.svc.cluster.local:8481/select/0/prometheus"
