---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - rbac.yaml
  - vmstorage.yaml
  - vminsert.yaml
  - vmselect.yaml
  - vmauth.yaml
  - vmagent.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: vmagent-config
    files:
      - vmagent-config.yaml
  - name: vmauth-config
    files:
      - vmauth-config.yaml
