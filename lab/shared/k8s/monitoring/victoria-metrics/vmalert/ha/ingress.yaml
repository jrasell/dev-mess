---
# Ingress resource exposing vmalert HA through the cluster's Traefik controller
# (e.g. http://192-168-64-10.vmalert.jrasell.test).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vmalert
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - host: "*.vmalert.jrasell.test"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vmalert
                port:
                  number: 8880
