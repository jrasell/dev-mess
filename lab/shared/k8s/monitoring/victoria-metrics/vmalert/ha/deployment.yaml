---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8880"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: vmalert
                topologyKey: kubernetes.io/hostname
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.154.1
          args:
            - "-rule=/config/rules.yaml"
            - "-datasource.url=http://victoriametrics.monitoring.svc.cluster.local:8428"
            - "-remoteRead.url=http://victoriametrics.monitoring.svc.cluster.local:8428"
            - "-remoteWrite.url=http://victoriametrics.monitoring.svc.cluster.local:8428"
            - "-notifier.url=http://alertmanager.monitoring.svc.cluster.local:9093"
            - "-evaluationInterval=15s"
          ports:
            - name: http
              containerPort: 8880
          readinessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: vmalert-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: vmalert-config
          configMap:
            name: vmalert-config
