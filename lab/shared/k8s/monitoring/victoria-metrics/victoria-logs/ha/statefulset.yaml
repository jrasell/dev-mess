---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victorialogs
spec:
  serviceName: victorialogs-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: victorialogs
  template:
    metadata:
      labels:
        app: victorialogs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9428"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: victorialogs
                topologyKey: kubernetes.io/hostname
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:v1.53.0
          args:
            - "-storageDataPath=/storage"
            - "-retentionPeriod=7d"
            - "-storageNode=victorialogs-0.victorialogs-headless.monitoring.svc.cluster.local:9428,victorialogs-1.victorialogs-headless.monitoring.svc.cluster.local:9428,victorialogs-2.victorialogs-headless.monitoring.svc.cluster.local:9428"
            - "-loggerFormat=json"
          ports:
            - name: http
              containerPort: 9428
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: vl-storage
              mountPath: /storage
      volumes:
        - name: vl-storage
          emptyDir: {}
