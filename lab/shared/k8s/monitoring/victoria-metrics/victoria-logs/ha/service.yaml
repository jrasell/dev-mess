---
apiVersion: v1
kind: Service
metadata:
  name: victorialogs-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: victorialogs
  ports:
    - name: http
      port: 9428
      targetPort: http
      protocol: TCP

