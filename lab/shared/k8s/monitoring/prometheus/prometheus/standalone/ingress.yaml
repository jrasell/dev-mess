---
# Optional Ingress resource exposing Prometheus through the cluster's
# Traefik controller (e.g. http://192-168-64-10.prometheus.jrasell.test).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - host: "*.prometheus.jrasell.test"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
