---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - rbac.yaml
  - statefulset.yaml
  - service.yaml
  - ingress.yaml

# Generates a ConfigMap with a content hash suffix such as
# prometheus-config-9f8b2. Any edit to the files creates a new ConfigMap and
# automatically rolls the pods.
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus-config.yaml
      - rules.yaml
