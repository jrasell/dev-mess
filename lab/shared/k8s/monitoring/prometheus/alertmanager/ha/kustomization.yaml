---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - statefulset.yaml
  - service.yaml
  - ingress.yaml

# Generates a ConfigMap with a content hash suffix such as
# alertmanager-config-9f8b2. Any edit to the file creates a new ConfigMap and
# automatically rolls the pods.
configMapGenerator:
  - name: alertmanager-config
    files:
      - alertmanager-config.yaml
