---
# Optional Ingress resource exposing Alertmanager HA through the cluster's
# Traefik controller (e.g. http://192-168-64-10.alertmanager.jrasell.test).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - host: "*.alertmanager.jrasell.test"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  number: 9093
