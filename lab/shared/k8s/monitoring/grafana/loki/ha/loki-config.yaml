---
# HA Grafana Loki configuration (3-replica scalable monolithic cluster).
# Replicas coordinate via a Memberlist gossip ring on port 7946 and replicate
# ingested log streams across 3 ingesters (`replication_factor: 3`).
auth_enabled: false
target: all

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  instance_addr: ${POD_IP}
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 3
  ring:
    kvstore:
      store: memberlist

memberlist:
  bind_port: 7946
  join_members:
    - dns+loki-headless.monitoring.svc.cluster.local:7946

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
