---
apiVersion: v1
kind: Service
metadata:
  name: loki-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: grpc
      protocol: TCP
    - name: memberlist
      port: 7946
      targetPort: memberlist
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: grpc
      protocol: TCP
