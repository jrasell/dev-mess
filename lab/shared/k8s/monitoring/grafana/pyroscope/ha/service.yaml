---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: pyroscope
  ports:
    - name: http
      port: 4040
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: grpc
      protocol: TCP
    - name: memberlist
      port: 7946
      targetPort: memberlist
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
spec:
  selector:
    app: pyroscope
  ports:
    - name: http
      port: 4040
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: grpc
      protocol: TCP
