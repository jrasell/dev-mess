---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pyroscope
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - host: "*.pyroscope.jrasell.test"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pyroscope
                port:
                  number: 4040
