---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-dashboards-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: grafana-dashboard-coredns
              mountPath: /etc/grafana/dashboards/coredns
              readOnly: true
            - name: grafana-dashboard-etcd
              mountPath: /etc/grafana/dashboards/etcd
              readOnly: true
            - name: grafana-dashboard-k8s-apiserver
              mountPath: /etc/grafana/dashboards/k8s-apiserver
              readOnly: true
            - name: grafana-dashboard-k8s-cilium
              mountPath: /etc/grafana/dashboards/k8s-cilium
              readOnly: true
            - name: grafana-dashboard-k8s-global
              mountPath: /etc/grafana/dashboards/k8s-global
              readOnly: true
            - name: grafana-dashboard-k8s-namespaces
              mountPath: /etc/grafana/dashboards/k8s-namespaces
              readOnly: true
            - name: grafana-dashboard-k8s-nodes
              mountPath: /etc/grafana/dashboards/k8s-nodes
              readOnly: true
            - name: grafana-dashboard-k8s-pods
              mountPath: /etc/grafana/dashboards/k8s-pods
              readOnly: true
            - name: grafana-dashboard-node-exporter
              mountPath: /etc/grafana/dashboards/node-exporter
              readOnly: true
            - name: grafana-dashboard-traefik
              mountPath: /etc/grafana/dashboards/traefik
              readOnly: true
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-provisioning
          configMap:
            name: grafana-dashboards-provisioning
        - name: grafana-dashboard-coredns
          configMap:
            name: grafana-dashboard-coredns
        - name: grafana-dashboard-etcd
          configMap:
            name: grafana-dashboard-etcd
        - name: grafana-dashboard-k8s-apiserver
          configMap:
            name: grafana-dashboard-k8s-apiserver
        - name: grafana-dashboard-k8s-cilium
          configMap:
            name: grafana-dashboard-k8s-cilium
        - name: grafana-dashboard-k8s-global
          configMap:
            name: grafana-dashboard-k8s-global
        - name: grafana-dashboard-k8s-namespaces
          configMap:
            name: grafana-dashboard-k8s-namespaces
        - name: grafana-dashboard-k8s-nodes
          configMap:
            name: grafana-dashboard-k8s-nodes
        - name: grafana-dashboard-k8s-pods
          configMap:
            name: grafana-dashboard-k8s-pods
        - name: grafana-dashboard-node-exporter
          configMap:
            name: grafana-dashboard-node-exporter
        - name: grafana-dashboard-traefik
          configMap:
            name: grafana-dashboard-traefik
        - name: grafana-storage
          emptyDir: {}
