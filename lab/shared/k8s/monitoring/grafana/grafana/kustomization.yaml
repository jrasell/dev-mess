---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: grafana-datasources
    files:
      - datasources.yaml
  - name: grafana-dashboards-provisioning
    files:
      - dashboards.yaml
  - name: grafana-dashboard-coredns
    files:
      - dashboards/coredns.json
  - name: grafana-dashboard-etcd
    files:
      - dashboards/etcd.json
  - name: grafana-dashboard-k8s-apiserver
    files:
      - dashboards/k8s-apiserver.json
  - name: grafana-dashboard-k8s-cilium
    files:
      - dashboards/k8s-cilium.json
  - name: grafana-dashboard-k8s-global
    files:
      - dashboards/k8s-global.json
  - name: grafana-dashboard-k8s-namespaces
    files:
      - dashboards/k8s-namespaces.json
  - name: grafana-dashboard-k8s-nodes
    files:
      - dashboards/k8s-nodes.json
  - name: grafana-dashboard-k8s-pods
    files:
      - dashboards/k8s-pods.json
  - name: grafana-dashboard-node-exporter
    files:
      - dashboards/node-exporter.json
  - name: grafana-dashboard-traefik
    files:
      - dashboards/traefik.json
