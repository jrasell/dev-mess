---
# Optional Ingress resource exposing Grafana through the cluster's
# Traefik controller (e.g. http://192-168-64-10.grafana.jrasell.test).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - host: "*.grafana.jrasell.test"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
