---
# Pre-provisioned Grafana datasources for the monitoring namespace.
# Prometheus is set as the default datasource; VictoriaMetrics, Alertmanager,
# and Pyroscope are also pre-configured so Grafana works out of the box with
# any monitoring option.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus.monitoring.svc.cluster.local:9090
    isDefault: true
    editable: true

  - name: VictoriaMetrics
    type: prometheus
    uid: victoriametrics
    access: proxy
    url: http://victoriametrics.monitoring.svc.cluster.local:8428
    isDefault: false
    editable: true

  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager.monitoring.svc.cluster.local:9093
    isDefault: false
    editable: true
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    access: proxy
    url: http://pyroscope.monitoring.svc.cluster.local:4040
    isDefault: false
    editable: true
