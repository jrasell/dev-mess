---
apiVersion: v1
kind: ConfigMap
metadata:
  name: terraform-enterprise-config
  labels:
    app: terraform-enterprise
data:
  # Listener & Admin Ports
  TFE_HTTP_PORT: "8080"
  TFE_HTTPS_PORT: "8443"
  TFE_ADMIN_HTTPS_PORT: "9443"

  # TLS Configuration
  TFE_TLS_CERT_FILE: "/etc/ssl/private/terraform-enterprise/cert.pem"
  TFE_TLS_KEY_FILE: "/etc/ssl/private/terraform-enterprise/key.pem"
  TFE_TLS_CA_BUNDLE_FILE: "/etc/ssl/private/terraform-enterprise/bundle.pem"

  # Workload Execution (Kubernetes Agent Driver)
  TFE_RUN_PIPELINE_DRIVER: "kubernetes"
  TFE_RUN_PIPELINE_KUBERNETES_NAMESPACE: "infra"
  TFE_RUN_PIPELINE_KUBERNETES_SERVICE_ACCOUNT: "terraform-enterprise"

  # Database (PostgreSQL)
  TFE_DATABASE_HOST: "postgres:5432"
  TFE_DATABASE_NAME: "postgres"
  TFE_DATABASE_USER: "postgres"
  TFE_DATABASE_PARAMETERS: "sslmode=disable"

  # Cache (Redis)
  TFE_REDIS_HOST: "redis:6379"
  TFE_REDIS_USE_AUTH: "false"
  TFE_REDIS_USE_TLS: "false"

  # Object Storage (RustFS S3-compatible)
  TFE_OBJECT_STORAGE_TYPE: "s3"
  TFE_OBJECT_STORAGE_S3_ENDPOINT: "http://rustfs:9000"
  TFE_OBJECT_STORAGE_S3_REGION: "mse1"
  TFE_OBJECT_STORAGE_S3_BUCKET: "tfe"
  TFE_OBJECT_STORAGE_S3_USE_INSTANCE_PROFILE: "false"
  TFE_OBJECT_STORAGE_S3_ACCESS_KEY_ID: "rustfsadmin"

  # Metrics
  TFE_METRICS_ENABLE: "true"
  TFE_METRICS_HTTP_PORT: "9090"
  TFE_METRICS_HTTPS_PORT: "9091"

  # Initial Admin User Creation Token (IACT)
  TFE_IACT_SUBNETS: "0.0.0.0/0"
  TFE_IACT_TIME_LIMIT: "60"

  # Logging & Usage
  TFE_LOG_LEVEL: "info"
  TFE_USAGE_REPORTING_OPT_OUT: "true"
