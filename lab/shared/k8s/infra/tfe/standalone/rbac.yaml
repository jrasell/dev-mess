---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraform-enterprise
  labels:
    app: terraform-enterprise

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraform-enterprise
  labels:
    app: terraform-enterprise
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraform-enterprise
  labels:
    app: terraform-enterprise
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: terraform-enterprise
subjects:
  - kind: ServiceAccount
    name: terraform-enterprise
    namespace: infra
