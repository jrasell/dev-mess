---
apiVersion: v1
kind: Service
metadata:
  name: terraform-enterprise
  labels:
    app: terraform-enterprise
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: "https"
spec:
  type: ClusterIP
  selector:
    app: terraform-enterprise
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: admin-https
      port: 8443
      targetPort: admin-https
      protocol: TCP
    - name: metrics-http
      port: 9090
      targetPort: metrics-http
      protocol: TCP
    - name: metrics-https
      port: 9091
      targetPort: metrics-https
      protocol: TCP
