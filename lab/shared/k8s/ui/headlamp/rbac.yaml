---
# Identity for Headlamp pods and token generation. To generate a token to login
# to the UI you can use `kubectl -n ui create token headlamp`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: ui
