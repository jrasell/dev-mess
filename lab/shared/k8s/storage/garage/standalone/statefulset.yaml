---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3903"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.5.0
          args:
            - "/garage"
            - "-c"
            - "/etc/garage.toml"
            - "server"
          env:
            - name: RUST_LOG
              value: "garage=info"
            - name: GARAGE_LOG_FORMAT
              value: "json"
          envFrom:
            - secretRef:
                name: garage-credentials
          ports:
            - name: s3-api
              containerPort: 3900
              protocol: TCP
            - name: rpc
              containerPort: 3901
              protocol: TCP
            - name: s3-web
              containerPort: 3902
              protocol: TCP
            - name: admin
              containerPort: 3903
              protocol: TCP
            - name: k2v-api
              containerPort: 3904
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 3900
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3900
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: data
              mountPath: /var/lib/garage/data
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: meta
          emptyDir: {}
        - name: data
          emptyDir: {}
