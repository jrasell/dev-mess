---
# One-shot Job that connects the 3 HA Garage nodes and initializes the cluster layout.
# Idempotent: skips initialization if the cluster layout is already applied.
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-layout-init
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: garage-layout-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: layout-init
          image: curlimages/curl:8.12.1
          envFrom:
            - secretRef:
                name: garage-credentials
          command:
            - "/bin/sh"
            - "-c"
            - |
              set -eu

              ADMIN_URL="http://garage-0.garage-headless:3903"
              AUTH_HEADER="Authorization: Bearer ${GARAGE_ADMIN_TOKEN}"

              echo "Waiting for all 3 Garage pods to respond..."
              for i in 0 1 2; do
                host="garage-${i}.garage-headless"
                until curl -sf -H "${AUTH_HEADER}" "http://${host}:3903/v2/GetClusterStatus" >/dev/null 2>&1; do
                  echo "  waiting for ${host}..."
                  sleep 2
                done
              done

              if curl -sf "${ADMIN_URL}/health" >/dev/null 2>&1; then
                echo "Garage cluster layout is already initialized and healthy."
                exit 0
              fi

              CONNECT_PEERS=""
              ROLES=""
              for i in 0 1 2; do
                host="garage-${i}.garage-headless"
                ip=$(getent hosts "${host}" | awk '{ print $1 }' | head -n 1)
                status=$(curl -sf -H "${AUTH_HEADER}" "http://${host}:3903/v2/GetClusterStatus")
                id=$(echo "${status}" | grep -oE '"id"[[:space:]]*:[[:space:]]*"[0-9a-f]{64}"' | grep -oE '[0-9a-f]{64}' | head -n 1)

                peer="\"${id}@${ip}:3901\""
                role="{\"id\":\"${id}\",\"zone\":\"dc1\",\"capacity\":1073741824,\"tags\":[\"garage-${i}\"]}"

                if [ -z "${CONNECT_PEERS}" ]; then
                  CONNECT_PEERS="${peer}"
                  ROLES="${role}"
                else
                  CONNECT_PEERS="${CONNECT_PEERS},${peer}"
                  ROLES="${ROLES},${role}"
                fi
              done

              echo "Connecting Garage cluster nodes..."
              curl -sf -X POST \
                -H "${AUTH_HEADER}" \
                -H "Content-Type: application/json" \
                -d "[${CONNECT_PEERS}]" \
                "${ADMIN_URL}/v2/ConnectClusterNodes" >/dev/null

              echo "Assigning layout roles to 3 nodes..."
              curl -sf -X POST \
                -H "${AUTH_HEADER}" \
                -H "Content-Type: application/json" \
                -d "{\"roles\":[${ROLES}]}" \
                "${ADMIN_URL}/v2/UpdateClusterLayout" >/dev/null

              echo "Applying cluster layout version 1..."
              curl -sf -X POST \
                -H "${AUTH_HEADER}" \
                -H "Content-Type: application/json" \
                -d '{"version":1}' \
                "${ADMIN_URL}/v2/ApplyClusterLayout" >/dev/null

              echo "Garage HA layout initialized successfully."
