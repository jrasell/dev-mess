---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage
spec:
  rules:
    - host: "*.garage.jrasell.test"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage-webui
                port:
                  number: 3909
    - host: "*.s3.garage.jrasell.test"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                port:
                  number: 3900
    - host: "*.web.garage.jrasell.test"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                port:
                  number: 3902
    - host: "*.admin.garage.jrasell.test"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                port:
                  number: 3903
