---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage
  labels:
    app: garage
    app.kubernetes.io/name: garage

---
# Allows Garage to register the `garagenodes.deuxfleurs.fr` CRD when
# `kubernetes_skip_crd = false`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: garage-crd-manager
  labels:
    app: garage
    app.kubernetes.io/name: garage
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: garage-crd-manager
  labels:
    app: garage
    app.kubernetes.io/name: garage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: garage-crd-manager
subjects:
  - kind: ServiceAccount
    name: garage
    namespace: storage

---
# Allows Garage pods to publish and watch `garagenodes.deuxfleurs.fr` resources
# for automatic peer discovery within the storage namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-peer-discovery
  labels:
    app: garage
    app.kubernetes.io/name: garage
rules:
  - apiGroups: ["deuxfleurs.fr"]
    resources: ["garagenodes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-peer-discovery
  labels:
    app: garage
    app.kubernetes.io/name: garage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-peer-discovery
subjects:
  - kind: ServiceAccount
    name: garage
    namespace: storage
