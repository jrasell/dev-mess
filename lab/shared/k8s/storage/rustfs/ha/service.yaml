---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-headless
  labels:
    app: rustfs
    app.kubernetes.io/name: rustfs
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: rustfs
  ports:
    - name: s3-api
      port: 9000
      targetPort: s3-api
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  labels:
    app: rustfs
    app.kubernetes.io/name: rustfs
spec:
  selector:
    app: rustfs
  ports:
    - name: s3-api
      port: 9000
      targetPort: s3-api
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
