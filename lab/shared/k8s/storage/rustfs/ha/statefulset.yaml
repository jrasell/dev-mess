---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  labels:
    app: rustfs
    app.kubernetes.io/name: rustfs
spec:
  serviceName: rustfs-headless
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
        app.kubernetes.io/name: rustfs
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: rustfs
                topologyKey: kubernetes.io/hostname
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.5
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUSTFS_LOCAL_ENDPOINT_HOST
              value: "$(POD_NAME).rustfs-headless.storage.svc.cluster.local"
          envFrom:
            - configMapRef:
                name: rustfs-config
            - secretRef:
                name: rustfs-credentials
          ports:
            - name: s3-api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3-api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: s3-api
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
