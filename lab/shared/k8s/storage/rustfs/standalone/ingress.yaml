---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs
spec:
  rules:
    - host: "*.rustfs.jrasell.test"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustfs
                port:
                  number: 9001
    - host: "*.s3.rustfs.jrasell.test"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustfs
                port:
                  number: 9000
