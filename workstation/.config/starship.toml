"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
${custom.nomad}\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "pruple"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](grey)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style) "
style = "cyan"
conflicted = ""
untracked = ""
modified = ""
staged = ""
renamed = ""
deleted = ""
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[custom.nomad]
command = "~/.config/starship/nomad.sh"
when = '[ -n "$NOMAD_NAMESPACE" ] ||[ -n "$NOMAD_REGION" ] ||[ -n "$NOMAD_ADDR" ]'
shell = ["bash", "--noprofile", "--norc"]
format = "[$output]($style) "
style = "bold green"
